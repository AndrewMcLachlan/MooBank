# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: Build and Deploy

on:
  push:
    branches:
      - "main"
  pull_request:
    branches:
      - "main"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      packages: read
    outputs:
      version: ${{ steps.set-version-number.outputs.version }}
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - name: Setup .NET
      uses: actions/setup-dotnet@v6

      with:
        dotnet-version: 10.x
        source-url: https://nuget.pkg.github.com/AndrewMcLachlan/index.json
      env:
        NUGET_AUTH_TOKEN: ${{secrets.CROSS_REPO_PACKAGE_TOKEN}}
    - name: Set version number
      id: set-version-number
      uses: andrewmclachlan/actions/set-version-number@v4
      with:
        project: 'src/MooBank.Api'
        version-property-name: 'Version'
        patch-version-type: 'commits-this-month'
    - run: echo "::notice::Version ${{ steps.set-version-number.outputs.version }}"
    - name: Restore dependencies
      run: dotnet restore MooBank.slnx
    - name: Setup node and npm
      uses: actions/setup-node@v7
      with:
        node-version: 24
        cache: npm
        cache-dependency-path: 'src/MooBank.Web.App/package-lock.json'
        registry-url: "https://npm.pkg.github.com"
    - name: Publish
      run: dotnet publish src/MooBank.Api/MooBank.Api.csproj --output ${{ github.workspace }}/publish --configuration Release --p:Version=${{ steps.set-version-number.outputs.version }} --p:FileVersion=${{ steps.set-version-number.outputs.version }} --no-restore
    - name: Install App dependencies
      env:
        NODE_AUTH_TOKEN: ${{ secrets.CROSS_REPO_PACKAGE_TOKEN }}
      run: npm ci --prefix src/MooBank.Web.App
    - name: Version App
      run: npm version ${{ steps.set-version-number.outputs.version }} --prefix src/MooBank.Web.App --force
    - name: Build App
      run: npm run build --prefix src/MooBank.Web.App
    - name: Copy App
      run: cp -r src/MooBank.Web.App/dist ${{ github.workspace }}/publish/wwwroot
    - name: Upload Artifact
      uses: actions/upload-artifact@v7.0.1
      with:
        name: publish
        path: ${{ github.workspace }}/publish
    - name: Build database project
      run: dotnet build src/MooBank.Database/MooBank.Database.sqlproj --configuration Release --no-restore
    - name: Upload dacpac
      uses: actions/upload-artifact@v7.0.1
      with:
        name: database
        path: src/MooBank.Database/bin/Release/*.dacpac
        if-no-files-found: error
    - name: Build Docker image (validation only)
      uses: docker/build-push-action@v7
      with:
        context: .
        file: ./src/MooBank.Api/Dockerfile
        push: false
        tags: |
          ghcr.io/andrewmclachlan/moobank:${{steps.set-version-number.outputs.version}}
          ghcr.io/andrewmclachlan/moobank:latest

  test:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      packages: write
      contents: read
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        test-project:
          - { name: "MooBank.Api.Tests" }
          - { name: "MooBank.Core.Tests" }
          - { name: "MooBank.Domain.Tests" }
          - { name: "MooBank.Infrastructure.Tests" }
          - { name: "MooBank.Institution.AustralianSuper.Tests" }
          - { name: "MooBank.Institution.Ing.Tests" }
          - { name: "MooBank.Institution.Macquarie.Tests" }
          - { name: "MooBank.Modules.Accounts.Tests" }
          - { name: "MooBank.Modules.Assets.Tests" }
          - { name: "MooBank.Modules.Bills.Tests" }
          - { name: "MooBank.Modules.Budgets.Tests" }
          - { name: "MooBank.Modules.Families.Tests" }
          - { name: "MooBank.Modules.Forecast.Tests" }
          - { name: "MooBank.Modules.Groups.Tests" }
          - { name: "MooBank.Modules.Institutions.Tests" }
          - { name: "MooBank.Modules.Instruments.Tests" }
          - { name: "MooBank.Modules.Reports.Tests" }
          - { name: "MooBank.Modules.Retirement.Tests" }
          - { name: "MooBank.Modules.Stocks.Tests" }
          - { name: "MooBank.Modules.Tags.Tests" }
          - { name: "MooBank.Modules.Transactions.Tests" }
          - { name: "MooBank.Modules.Users.Tests" }
    steps:
    - uses: actions/checkout@v7
    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.x
        source-url: https://nuget.pkg.github.com/AndrewMcLachlan/index.json
      env:
        NUGET_AUTH_TOKEN: ${{secrets.CROSS_REPO_PACKAGE_TOKEN}}

    - name: Test ${{ matrix.test-project.name }}
      run: dotnet test tests/${{ matrix.test-project.name }}/${{ matrix.test-project.name }}.csproj --filter '(Category=Unit|Category=Integration)&FullyQualifiedName!~Testing' --verbosity normal --collect:"XPlat Code Coverage" --results-directory:./testresults/${{ matrix.test-project.name }} --configuration Release --settings coverlet.runsettings

    - name: Upload coverage for ${{ matrix.test-project.name }}
      uses: actions/upload-artifact@v7.0.1
      with:
        name: coverage-${{ matrix.test-project.name }}
        path: testresults/${{ matrix.test-project.name }}/**/coverage.cobertura.xml

  test-frontend:
    runs-on: ubuntu-latest
    permissions:
      packages: read
      contents: read
    steps:
    - uses: actions/checkout@v7
    - name: Setup node and npm
      uses: actions/setup-node@v7
      with:
        node-version: 24
        cache: npm
        cache-dependency-path: 'src/MooBank.Web.App/package-lock.json'
        registry-url: "https://npm.pkg.github.com"
    - name: Install App dependencies
      env:
        NODE_AUTH_TOKEN: ${{ secrets.CROSS_REPO_PACKAGE_TOKEN }}
      run: npm ci --prefix src/MooBank.Web.App
    - name: Test App
      run: npm run test:coverage --prefix src/MooBank.Web.App
    - name: Upload frontend coverage
      uses: actions/upload-artifact@v7.0.1
      with:
        name: coverage-frontend
        path: src/MooBank.Web.App/coverage/cobertura-coverage.xml

  coverage-report:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      pull-requests: write
    steps:
    - uses: actions/checkout@v7

    - name: Download all coverage reports
      uses: actions/download-artifact@v8
      with:
        pattern: coverage-*
        path: ./all-coverage
        merge-multiple: true

    - name: ReportGenerator
      uses: danielpalme/ReportGenerator-GitHub-Action@5.5.11
      with:
        reports: './all-coverage/**/coverage.cobertura.xml'
        targetdir: './coverage-report'
        reporttypes: 'MarkdownAssembliesSummary;Cobertura;'

    - name: Add Coverage PR Comment
      uses: marocchino/sticky-pull-request-comment@v3
      if: (github.event_name == 'pull_request' || github.event_name == 'pull_request_target')
      with:
        recreate: true
        path: coverage-report/Summary.md

    - name: Write Coverage to Job Summary
      run: cat coverage-report/Summary.md >> $GITHUB_STEP_SUMMARY

  docker-push:
    runs-on: ubuntu-latest
    needs: [build, test, test-frontend]
    if: (github.event_name != 'pull_request' && github.event_name != 'pull_request_target' && github.ref == 'refs/heads/main')
    permissions:
      packages: write
      contents: read
    steps:
    - uses: actions/checkout@v7
    - name: Download publish artifact
      uses: actions/download-artifact@v8
      with:
        name: publish
        path: ${{ github.workspace }}/publish
    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Build and push Docker image
      uses: docker/build-push-action@v7
      with:
        context: .
        file: ./src/MooBank.Api/Dockerfile
        push: true
        tags: |
          ghcr.io/andrewmclachlan/moobank:${{needs.build.outputs.version}}
          ghcr.io/andrewmclachlan/moobank:latest
        cache-from: type=registry,ref=ghcr.io/andrewmclachlan/moobank:latest
        cache-to: type=inline

  # Schema goes first, and in its own concurrency group: a superseded app deploy is harmless, but
  # SqlPackage killed part way through a schema change is not. These queue rather than cancel.
  database-staging:
    concurrency:
      group: moobank-staging
      cancel-in-progress: false
    needs: [build, test, test-frontend, docker-push]
    if: (github.event_name != 'pull_request' && github.event_name != 'pull_request_target' && github.ref == 'refs/heads/main')
    # TEMPORARY: pinned to the branch so this can be proved before it is released.
    # Change to @v4 once AndrewMcLachlan/Actions#36 is merged and v4.8 is cut.
    uses: AndrewMcLachlan/actions/.github/workflows/deploy-sql-database.yml@feature/deploy-sql-database
    with:
      environment: Staging
      artifact-name: database
      server-name: mclachlan-staging
      database-name: MooBank-Staging
      resource-group: Data-Staging
      publish-profile: src/MooBank.Database/Deploy.publish.xml
    secrets:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

  staging:
    concurrency:
      group: moobank-staging
      cancel-in-progress: false
    needs: [build, test, test-frontend, docker-push]
    if: (github.event_name != 'pull_request' && github.event_name != 'pull_request_target' && github.ref == 'refs/heads/main')
    uses: AndrewMcLachlan/actions/.github/workflows/deploy-azure.yml@v4
    with:
      environment: Staging
      artifact-name: publish
      app-name: moobank
      resource-group: MooBank
      slot-name: staging
      container-image: ghcr.io/andrewmclachlan/moobank:${{needs.build.outputs.version}}
      container-name: main
    secrets:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

  # The one approval for a production release. It does nothing, which is the point: GitHub asks
  # for environment approval once per job, so the gate has to be a job by itself or every job
  # behind it asks again. Approving this approves the release; what follows is the release.
  approve-production:
    runs-on: ubuntu-latest
    environment: Production
    needs: [staging, database-staging]
    if: (github.event_name != 'pull_request' && github.event_name != 'pull_request_target' && github.ref == 'refs/heads/main')
    steps:
      - run: echo "::notice::Starting production deployment"

  # The production schema lands after staging has exercised it, and before the swap puts the new
  # code in front of it.
  database-production:
    concurrency:
      group: moobank-production
      cancel-in-progress: false
    needs: approve-production
    if: (github.event_name != 'pull_request' && github.event_name != 'pull_request_target' && github.ref == 'refs/heads/main')
    # TEMPORARY: pinned to the branch so this can be proved before it is released.
    # Change to @v4 once AndrewMcLachlan/Actions#36 is merged and v4.8 is cut.
    uses: AndrewMcLachlan/actions/.github/workflows/deploy-sql-database.yml@feature/deploy-sql-database
    with:
      artifact-name: database
      server-name: mclachlan
      database-name: MooBank
      resource-group: Data
      publish-profile: src/MooBank.Database/Deploy.publish.xml
    secrets:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

  production:
    concurrency:
      group: moobank-production
      cancel-in-progress: false
    needs: approve-production
    if: (github.event_name != 'pull_request' && github.event_name != 'pull_request_target' && github.ref == 'refs/heads/main')
    # TEMPORARY: pinned alongside the database workflow, for the optional environment input.
    # Back to @v4 with the others once AndrewMcLachlan/Actions#36 is released.
    uses: AndrewMcLachlan/actions/.github/workflows/azure-appservice-swap-slot.yml@feature/deploy-sql-database
    with:
      app-name: moobank
      resource-group: MooBank
      slot-name: staging
    secrets:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

  post-production:
    concurrency:
      group: moobank-post-production
      cancel-in-progress: true
    needs: [build, production, database-production]
    if: (github.event_name != 'pull_request' && github.event_name != 'pull_request_target' && github.ref == 'refs/heads/main')
    uses: AndrewMcLachlan/actions/.github/workflows/deploy-azure.yml@v4
    with:
      environment: Post-Production
      artifact-name: publish
      app-name: moobank
      resource-group: MooBank
      slot-name: staging
      container-image: ghcr.io/andrewmclachlan/moobank:${{needs.build.outputs.version}}
      container-name: main
    secrets:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
